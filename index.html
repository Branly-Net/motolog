<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ServiTrace — On-Chain Service History Log</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #2a2e38;
    --text: #e6e8ec;
    --muted: #9aa0ac;
    --accent: #ff5a36;
    --accent-hover: #ff7a5c;
    --success: #3ecf8e;
    --error: #ff5f5f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 24px; }
  header h1 { font-size: 1.6rem; margin: 0 0 4px; }
  header p { color: var(--muted); font-size: 0.9rem; margin: 0; }

  #walletBar {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 16px; margin-bottom: 20px;
  }
  #walletStatus { font-size: 0.85rem; color: var(--muted); }
  #walletStatus.connected { color: var(--success); }
  button {
    background: var(--accent); color: #fff; border: none;
    padding: 10px 18px; border-radius: 8px; font-size: 0.9rem;
    cursor: pointer; font-weight: 600; transition: background 0.15s;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { background: #444; cursor: not-allowed; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px; margin-bottom: 20px;
  }
  .card h2 { font-size: 1.05rem; margin: 0 0 14px; }
  label {
    display: block; font-size: 0.8rem; color: var(--muted);
    margin: 10px 0 4px;
  }
  input {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: #0c0e12; color: var(--text);
    font-size: 0.9rem;
  }
  input:focus { outline: 1px solid var(--accent); }
  .actions { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }

  #log {
    font-size: 0.8rem; padding: 10px 12px; border-radius: 8px;
    margin-top: 12px; display: none; word-break: break-word;
  }
  #log.show { display: block; }
  #log.ok { background: rgba(62,207,142,0.1); border: 1px solid var(--success); color: var(--success); }
  #log.err { background: rgba(255,95,95,0.1); border: 1px solid var(--error); color: var(--error); }

  .item-info {
    background: #0c0e12; border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; margin-top: 14px; font-size: 0.85rem;
  }
  .item-info div { margin-bottom: 4px; }
  .item-info .label { color: var(--muted); display: inline-block; width: 90px; }

  .record {
    background: #0c0e12; border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; margin-top: 10px; font-size: 0.85rem;
  }
  .record .type { font-weight: 700; color: var(--accent); }
  .record .meta { color: var(--muted); font-size: 0.78rem; margin-top: 4px; }
  .empty-state { color: var(--muted); font-size: 0.85rem; text-align: center; padding: 16px 0; }

  footer {
    text-align: center; margin-top: 30px; padding-top: 16px;
    border-top: 1px solid var(--border); font-size: 0.75rem; color: var(--muted);
  }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>🔧 ServiTrace</h1>
    <p>On-chain service history log — riwayat servis yang tidak bisa hilang atau dipalsukan</p>
  </header>

  <div id="walletBar">
    <span id="walletStatus">Wallet belum terhubung</span>
    <button id="connectBtn">Connect Wallet</button>
  </div>

  <!-- REGISTER ITEM -->
  <div class="card">
    <h2>1. Daftarkan Item Baru</h2>
    <label for="itemNameInput">Nama Item</label>
    <input id="itemNameInput" placeholder="Contoh: Honda Vario 2020" />
    <div class="actions">
      <button id="registerBtn">Register Item</button>
    </div>
    <div id="registerLog" class="log"></div>
  </div>

  <!-- ADD SERVICE RECORD -->
  <div class="card">
    <h2>2. Tambah Record Servis</h2>
    <label for="serviceItemId">Item ID</label>
    <input id="serviceItemId" type="number" placeholder="Contoh: 1" />
    <label for="serviceType">Jenis Servis</label>
    <input id="serviceType" placeholder="Contoh: Ganti oli" />
    <label for="technician">Nama Teknisi / Bengkel</label>
    <input id="technician" placeholder="Contoh: Bengkel Jaya" />
    <label for="notes">Catatan (opsional)</label>
    <input id="notes" placeholder="Contoh: Servis rutin 5000km" />
    <div class="actions">
      <button id="addServiceBtn">Tambah Record</button>
    </div>
    <div id="serviceLog" class="log"></div>
  </div>

  <!-- LOOKUP -->
  <div class="card">
    <h2>3. Cek Riwayat Servis</h2>
    <label for="lookupItemId">Item ID</label>
    <input id="lookupItemId" type="number" placeholder="Contoh: 1" />
    <div class="actions">
      <button id="lookupBtn">Cek Riwayat</button>
    </div>
    <div id="lookupLog" class="log"></div>

    <div id="itemInfoBox"></div>
    <div id="historyBox"></div>
  </div>

  <footer>
    Powered by <strong>BOT Chain</strong> — <a href="https://botchain.ai" target="_blank">botchain.ai</a> ·
    <a href="#" id="explorerLink" target="_blank">BOT Chain Explorer</a>
  </footer>

</div>

<script>
  // ==========================================================
  // KONFIGURASI — ISI BAGIAN INI SEBELUM DIPAKAI
  // ==========================================================
  const CONTRACT_ADDRESS = "0x4E2c00501170E2b0E178eeC44770304a4d8755a6";
  const EXPLORER_BASE_URL = "https://scan.bohr.life/address/0x4E2c00501170E2b0E178eeC44770304a4d8755a6"; // sesuaikan dengan URL explorer BOT Chain
  document.getElementById("explorerLink").href = EXPLORER_BASE_URL + CONTRACT_ADDRESS;

  const CONTRACT_ABI = [
    {
      "inputs": [{ "internalType": "string", "name": "itemName", "type": "string" }],
      "name": "registerItem",
      "outputs": [{ "internalType": "uint256", "name": "", "type": "uint256" }],
      "stateMutability": "nonpayable", "type": "function"
    },
    {
      "inputs": [
        { "internalType": "uint256", "name": "itemId", "type": "uint256" },
        { "internalType": "string", "name": "serviceType", "type": "string" },
        { "internalType": "string", "name": "technician", "type": "string" },
        { "internalType": "string", "name": "notes", "type": "string" }
      ],
      "name": "addServiceRecord", "outputs": [],
      "stateMutability": "nonpayable", "type": "function"
    },
    {
      "inputs": [{ "internalType": "uint256", "name": "itemId", "type": "uint256" }],
      "name": "getServiceHistory",
      "outputs": [{
        "components": [
          { "internalType": "string", "name": "serviceType", "type": "string" },
          { "internalType": "string", "name": "technician", "type": "string" },
          { "internalType": "string", "name": "notes", "type": "string" },
          { "internalType": "uint256", "name": "timestamp", "type": "uint256" }
        ],
        "internalType": "struct ServiTrace.ServiceRecord[]", "name": "", "type": "tuple[]"
      }],
      "stateMutability": "view", "type": "function"
    },
    {
      "inputs": [{ "internalType": "uint256", "name": "itemId", "type": "uint256" }],
      "name": "getItem",
      "outputs": [{
        "components": [
          { "internalType": "string", "name": "itemName", "type": "string" },
          { "internalType": "address", "name": "owner", "type": "address" },
          { "internalType": "bool", "name": "exists", "type": "bool" }
        ],
        "internalType": "struct ServiTrace.Item", "name": "", "type": "tuple"
      }],
      "stateMutability": "view", "type": "function"
    }
  ];
  // ==========================================================

  let provider, signer, contract, userAddress;

  const walletStatus = document.getElementById("walletStatus");
  const connectBtn = document.getElementById("connectBtn");

  function showLog(elId, message, isError) {
    const el = document.getElementById(elId);
    el.textContent = message;
    el.className = "log show " + (isError ? "err" : "ok");
  }

  async function connectWallet() {
    if (typeof window.ethereum === "undefined") {
      alert("MetaMask tidak terdeteksi. Silakan install MetaMask terlebih dahulu.");
      return;
    }
    try {
      provider = new ethers.providers.Web3Provider(window.ethereum);
      await provider.send("eth_requestAccounts", []);
      signer = provider.getSigner();
      userAddress = await signer.getAddress();
      contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

      walletStatus.textContent = "Terhubung: " + userAddress.slice(0, 6) + "..." + userAddress.slice(-4);
      walletStatus.classList.add("connected");
      connectBtn.textContent = "Connected";
      connectBtn.disabled = true;
    } catch (err) {
      console.error(err);
      alert("Gagal connect wallet: " + (err.message || err));
    }
  }

  async function registerItem() {
    if (!contract) return alert("Connect wallet dulu.");
    const name = document.getElementById("itemNameInput").value.trim();
    if (!name) return alert("Isi nama item dulu.");

    try {
      showLog("registerLog", "Mengirim transaksi...", false);
      const tx = await contract.registerItem(name);
      showLog("registerLog", "Menunggu konfirmasi blockchain...", false);
      const receipt = await tx.wait();

      const event = receipt.events?.find(e => e.event === "ItemRegistered");
      const itemId = event ? event.args.itemId.toString() : "?";

      showLog("registerLog", `Berhasil! Item ID kamu: ${itemId}`, false);
      document.getElementById("serviceItemId").value = itemId;
      document.getElementById("lookupItemId").value = itemId;
    } catch (err) {
      console.error(err);
      showLog("registerLog", "Gagal: " + (err.reason || err.message || err), true);
    }
  }

  async function addServiceRecord() {
    if (!contract) return alert("Connect wallet dulu.");
    const itemId = document.getElementById("serviceItemId").value;
    const serviceType = document.getElementById("serviceType").value.trim();
    const technician = document.getElementById("technician").value.trim();
    const notes = document.getElementById("notes").value.trim();

    if (!itemId || !serviceType || !technician) {
      return alert("Isi Item ID, Jenis Servis, dan Nama Teknisi.");
    }

    try {
      showLog("serviceLog", "Mengirim transaksi...", false);
      const tx = await contract.addServiceRecord(itemId, serviceType, technician, notes);
      showLog("serviceLog", "Menunggu konfirmasi blockchain...", false);
      await tx.wait();
      showLog("serviceLog", "Record servis berhasil ditambahkan!", false);
    } catch (err) {
      console.error(err);
      showLog("serviceLog", "Gagal: " + (err.reason || err.message || err), true);
    }
  }

  async function lookupHistory() {
    if (!contract) return alert("Connect wallet dulu.");
    const itemId = document.getElementById("lookupItemId").value;
    if (!itemId) return alert("Isi Item ID dulu.");

    const itemInfoBox = document.getElementById("itemInfoBox");
    const historyBox = document.getElementById("historyBox");
    itemInfoBox.innerHTML = "";
    historyBox.innerHTML = "";

    try {
      showLog("lookupLog", "Mengambil data...", false);
      const item = await contract.getItem(itemId);
      const history = await contract.getServiceHistory(itemId);

      itemInfoBox.innerHTML = `
        <div class="item-info">
          <div><span class="label">Nama Item</span>: ${item.itemName}</div>
          <div><span class="label">Owner</span>: ${item.owner.slice(0,6)}...${item.owner.slice(-4)}</div>
          <div><span class="label">Item ID</span>: ${itemId}</div>
        </div>`;

      if (history.length === 0) {
        historyBox.innerHTML = `<div class="empty-state">Belum ada riwayat servis untuk item ini.</div>`;
      } else {
        historyBox.innerHTML = history.map(r => {
          const date = new Date(r.timestamp.toNumber() * 1000).toLocaleString("id-ID");
          return `
            <div class="record">
              <div class="type">${r.serviceType}</div>
              <div>Teknisi: ${r.technician}</div>
              ${r.notes ? `<div>Catatan: ${r.notes}</div>` : ""}
              <div class="meta">${date}</div>
            </div>`;
        }).join("");
      }

      showLog("lookupLog", "Data berhasil dimuat.", false);
    } catch (err) {
      console.error(err);
      showLog("lookupLog", "Gagal: item mungkin belum terdaftar. (" + (err.reason || err.message || err) + ")", true);
    }
  }

  connectBtn.addEventListener("click", connectWallet);
  document.getElementById("registerBtn").addEventListener("click", registerItem);
  document.getElementById("addServiceBtn").addEventListener("click", addServiceRecord);
  document.getElementById("lookupBtn").addEventListener("click", lookupHistory);
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</body>
</html>
